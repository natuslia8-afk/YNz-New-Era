        # 7. Kotlin Files
        cat > app/src/main/java/com/lo/ynznewera/MainActivity.kt << 'EOF'
        package com.lo.ynznewera
        import android.content.Intent
        import android.os.Bundle
        import android.widget.Button
        import android.widget.EditText
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)
                val etPass = findViewById<EditText>(R.id.etPass)
                val btnOk = findViewById<Button>(R.id.btnOk)
                val btnGetPass = findViewById<Button>(R.id.btnGetPass)
                val PASSWORD = "YNZ NEW ERA"
                btnOk.setOnClickListener {
                    if (etPass.text.toString() == PASSWORD) {
                        startActivity(Intent(this, MenuActivity::class.java))
                        finish()
                    } else {
                        Toast.makeText(this, "Password Salah!", Toast.LENGTH_SHORT).show()
                    }
                }
                btnGetPass.setOnClickListener { startActivity(Intent(this, GetPassActivity::class.java)) }
            }
        }
        EOF

        cat > app/src/main/java/com/lo/ynznewera/GetPassActivity.kt << 'EOF'
        package com.lo.ynznewera
        import android.content.Intent
        import android.net.Uri
        import android.os.Bundle
        import android.widget.Button
        import androidx.appcompat.app.AppCompatActivity

        class GetPassActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_get_pass)
                findViewById<Button>(R.id.btnTelegram).setOnClickListener {
                    startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://t.me/ynz_newera")))
                }
            }
