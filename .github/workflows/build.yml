            <LinearLayout android:id="@+id/btnCrashBiasa" android:layout_width="match_parent" android:layout_height="65dp" android:background="@drawable/box_red" android:orientation="horizontal" android:gravity="center_vertical" android:padding="16dp" android:layout_marginBottom="12dp">
                <TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="💀 Crash Biasa\nCrash ringan, aman." android:textColor="@color/white_text"/>
                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text=">" android:textColor="@color/red_neon" android:textSize="20sp"/>
            </LinearLayout>
            <LinearLayout android:id="@+id/btnCrashParah" android:layout_width="match_parent" android:layout_height="65dp" android:background="@drawable/box_red" android:orientation="horizontal" android:gravity="center_vertical" android:padding="16dp" android:layout_marginBottom="12dp">
                <TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="💀 Crash Parah\nCrash total, brutal." android:textColor="@color/white_text"/>
