        EOF

        cat > app/src/main/java/com/lo/ynznewera/MenuActivity.kt << 'EOF'
        package com.lo.ynznewera
        import android.content.Intent
        import android.os.Build
        import android.os.Bundle
        import android.widget.ImageView
        import android.widget.LinearLayout
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity

        class MenuActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_menu)
                val btnCrashBiasa = findViewById<LinearLayout>(R.id.btnCrashBiasa)
                val btnCrashParah = findViewById<LinearLayout>(R.id.btnCrashParah)
                val btnBanned = findViewById<LinearLayout>(R.id.btnBanned)
                val btnProfile = findViewById<ImageView>(R.id.btnProfile)
                btnCrashBiasa.setOnClickListener {
                    Toast.makeText(this, "Memulai Crash Ringan...", Toast.LENGTH_SHORT).show()
                    val i = Intent(this, CrashService::class.java).putExtra("mode", "biasa")
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i) else startService(i)
                }
                btnCrashParah.setOnClickListener {
                    Toast.makeText(this, "Memulai Crash Brutal...", Toast.LENGTH_SHORT).show()
                    val i = Intent(this, CrashService::class.java).putExtra("mode", "parah")
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i) else startService(i)
                }
                btnBanned.setOnClickListener { Toast.makeText(this, "Fitur Banned disimulasikan.", Toast.LENGTH_SHORT).show() }
                btnProfile.setOnClickListener { startActivity(Intent(this, DeveloperActivity::class.java)) }
            }
        }
        EOF

        cat > app/src/main/java/com/lo/ynznewera/DeveloperActivity.kt << 'EOF'
        package com.lo.ynznewera
