name: Build YNZ New Era APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Android Project Files
      run: |
        mkdir -p app/src/main/java/com/lo/ynznewera
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable

        # 1. Root Gradle
        cat > build.gradle << 'EOF'
        plugins {
            id 'com.android.application' version '8.2.0' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
        }
        EOF

        cat > settings.gradle << 'EOF'
        pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
        }
        rootProject.name = "YNZNewEra"
        include ':app'
        EOF

        # 2. App Gradle
        cat > app/build.gradle << 'EOF'
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.lo.ynznewera'
            compileSdk 34
            defaultConfig {
                applicationId "com.lo.ynznewera"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            buildTypes { release { minifyEnabled false } }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

        # 3. Manifest
        cat > app/src/main/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.lo.ynznewera">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <queries>
                <package android:name="com.whatsapp" />
            </queries>
            <application android:allowBackup="true" android:label="YNZ NEW ERA" android:theme="@style/Theme.YNZNewEra">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <activity android:name=".MenuActivity" />
                <activity android:name=".GetPassActivity" />
                <activity android:name=".DeveloperActivity" />
                <service android:name=".CrashService" android:foregroundServiceType="dataSync" />
            </application>
        </manifest>
        EOF

        # 4. Colors & Themes
        cat > app/src/main/res/values/colors.xml << 'EOF'
        <resources>
            <color name="black_bg">#050000</color>
            <color name="red_neon">#FF0000</color>
            <color name="red_dark">#800000</color>
            <color name="gray_text">#A0A0A0</color>
            <color name="white_text">#FFFFFF</color>
        </resources>
        EOF

        cat > app/src/main/res/values/themes.xml << 'EOF'
        <resources>
            <style name="Theme.YNZNewEra" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                <item name="colorPrimary">@color/red_dark</item>
                <item name="colorPrimaryVariant">@color/red_neon</item>
                <item name="colorOnPrimary">@color/white_text</item>
                <item name="android:windowBackground">@color/black_bg</item>
                <item name="android:statusBarColor">@color/black_bg</item>
            </style>
        </resources>
        EOF

        # 5. Drawables
        cat > app/src/main/res/drawable/box_red.xml << 'EOF'
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="@color/black_bg" />
            <stroke android:width="1.5dp" android:color="@color/red_neon" />
            <corners android:radius="8dp" />
        </shape>
        EOF

        cat > app/src/main/res/drawable/btn_red.xml << 'EOF'
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <gradient android:startColor="#FF0000" android:endColor="#800000" android:angle="270" />
            <corners android:radius="6dp" />
        </shape>
        EOF

        # 6. Layouts
        cat > app/src/main/res/layout/activity_main.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:background="@color/black_bg" android:padding="20dp">
            <LinearLayout
                android:layout_width="match_parent" android:layout_height="wrap_content"
                android:layout_centerInParent="true" android:orientation="vertical" android:gravity="center">
                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                    android:text="YNZ\nNEW ERA" android:textColor="@color/white_text" android:textSize="55sp"
                    android:textStyle="bold" android:gravity="center" android:shadowColor="@color/red_neon" android:shadowRadius="20"/>
                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                    android:text="- ACCESS SYSTEM -" android:textColor="@color/gray_text" android:layout_marginBottom="40dp"/>
                <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                    android:background="@drawable/box_red" android:orientation="vertical" android:padding="16dp">
                    <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                        android:text="🔒 Enter Password" android:textColor="@color/white_text" android:textSize="18sp" android:textStyle="bold" android:layout_marginBottom="10dp"/>
                    <EditText android:id="@+id/etPass" android:layout_width="match_parent" android:layout_height="45dp"
                        android:background="#1A0000" android:padding="10dp" android:textColor="@color/white_text"
                        android:textColorHint="@color/gray_text" android:hint="Masukkan Password..." android:layout_marginBottom="16dp"/>
                    <Button android:id="@+id/btnOk" android:layout_width="match_parent" android:layout_height="50dp"
                        android:text="OK" android:textSize="18sp" android:textStyle="bold" android:textColor="@color/white_text" android:background="@drawable/btn_red"/>
                </LinearLayout>
                <Button android:id="@+id/btnGetPass" android:layout_width="match_parent" android:layout_height="45dp"
                    android:text="✈ Get Password" android:textColor="@color/white_text" android:background="@drawable/box_red" android:layout_marginTop="20dp"/>
                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                    android:text="© YNZ NEW ERA - 2025\nAll Rights Reserved." android:textColor="@color/gray_text" android:textSize="10sp" android:gravity="center" android:layout_marginTop="30dp"/>
            </LinearLayout>
        </RelativeLayout>
        EOF

